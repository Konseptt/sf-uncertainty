[project]
name = "sfu"
version = "0.1.0"
description = "Spatial-frequency uncertainty and population SF tuning: exploratory PsychoPy prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "pandas>=2.0"]

[project.optional-dependencies]
display = ["psychopy"]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["sfu"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
